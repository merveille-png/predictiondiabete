<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — DiaCheck</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

<link href="assets/css/style.css?v=20260918d" rel="stylesheet">

<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .carte-connexion {
    width: 100%;
    max-width: 420px;
    background: var(--couleur-carte);
    border-radius: 20px;
    box-shadow: var(--ombre-douce);
    border: 1px solid var(--couleur-bordure);
    overflow: hidden;
  }
  .carte-connexion .entete-form {
    background: linear-gradient(135deg, var(--couleur-primaire), var(--couleur-primaire-claire));
    color: #fff;
    padding: 32px;
    text-align: center;
  }
  .carte-connexion .entete-form i { font-size: 2rem; }
  .carte-connexion .corps-form { padding: 32px; }
</style>
</head>
<body>

<div class="carte-connexion">
  <div class="entete-form">
    <i class="bi bi-heart-pulse-fill d-block mb-2"></i>
    <h4 class="mb-1 text-white">DiaCheck</h4>
    <p class="mb-0 opacity-75 small">Connexion à l'espace de dépistage</p>
  </div>
  <div class="corps-form">
    <form id="formulaire-connexion">
      <div class="mb-3 champ">
        <label for="nom_utilisateur">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="nom_utilisateur" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3 champ">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" class="form-control" id="mot_de_passe" name="password" autocomplete="current-password" required>
      </div>
      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="se-souvenir">
        <label class="form-check-label" for="se-souvenir">Se souvenir de moi</label>
      </div>
      <button type="submit" id="bouton-connexion" class="btn btn-dia-primaire btn-lg w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const CLE_NOM_UTILISATEUR = "diacheck_nom_utilisateur_souvenu";

  // Pré-remplit le nom d'utilisateur mémorisé (jamais le mot de passe,
  // qui reste géré par le gestionnaire de mots de passe du navigateur).
  document.addEventListener("DOMContentLoaded", () => {
    try {
      const nomMemorise = localStorage.getItem(CLE_NOM_UTILISATEUR);
      if (nomMemorise) {
        document.getElementById("nom_utilisateur").value = nomMemorise;
        document.getElementById("se-souvenir").checked = true;
        document.getElementById("mot_de_passe").focus();
      }
    } catch (erreur) {
      // localStorage indisponible (navigation privée, etc.) : on ignore simplement.
    }
  });

  document.getElementById("formulaire-connexion").addEventListener("submit", async (evenement) => {
    evenement.preventDefault();

    const bouton = document.getElementById("bouton-connexion");
    const texteOriginal = bouton.innerHTML;
    bouton.disabled = true;
    bouton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Connexion...';

    const nomUtilisateur = document.getElementById("nom_utilisateur").value;

    try {
      const reponse = await fetch("/api/connexion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nom_utilisateur: nomUtilisateur,
          mot_de_passe: document.getElementById("mot_de_passe").value,
        }),
      });

      if (!reponse.ok) {
        const detail = await reponse.json().catch(() => null);
        throw new Error(detail && detail.detail ? detail.detail : "Connexion refusée.");
      }

      try {
        if (document.getElementById("se-souvenir").checked) {
          localStorage.setItem(CLE_NOM_UTILISATEUR, nomUtilisateur);
        } else {
          localStorage.removeItem(CLE_NOM_UTILISATEUR);
        }
      } catch (erreur) {
        // localStorage indisponible : la connexion continue normalement.
      }

      window.location.href = "/";
    } catch (erreur) {
      Swal.fire({
        icon: "error",
        title: "Connexion impossible",
        text: erreur.message,
        confirmButtonText: "Réessayer",
        confirmButtonColor: "#e11d48",
      });
    } finally {
      bouton.disabled = false;
      bouton.innerHTML = texteOriginal;
    }
  });
</script>
</body>
</html>
